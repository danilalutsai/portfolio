<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440"
     viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9f68"/><stop offset="0.3" stop-color="#27916b"/><stop offset="0.62" stop-color="#23767f"/><stop offset="0.86" stop-color="#2b5f9e"/><stop offset="1" stop-color="#274c86"/></linearGradient>

    <radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8affb2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#75ff9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a97f5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#69a8fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fe0c4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4fe0c4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wMint" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#b6ffd0"/><stop offset="1" stop-color="#75ff9f"/>
    </linearGradient>
    <linearGradient id="wBlue" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#7fe8d8"/><stop offset="1" stop-color="#69a8fa"/>
    </linearGradient>
    <linearGradient id="wDeep" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#4f8cf0"/><stop offset="1" stop-color="#3f74d8"/>
    </linearGradient>

    <linearGradient id="veil" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0d3a4f" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#0d3a4f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0d3a4f" stop-opacity="0.22"/>
    </linearGradient>

    <!-- circuit-node motif, replacing the waves -->
    <pattern id="circuitGrid" width="260" height="260" patternUnits="userSpaceOnUse">
      <path d="M0 130 H90 V40 H260 M90 130 V260 M170 130 H260 M170 130 V0"
            fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="90" cy="130" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="170" cy="130" r="4" fill="#ffffff" fill-opacity="0.25"/>
      <circle cx="90" cy="40" r="4" fill="#ffffff" fill-opacity="0.25"/>
      <circle cx="0" cy="130" r="4" fill="#ffffff" fill-opacity="0.2"/>
    </pattern>

    <!-- IT / hardware silhouette pattern, black at 25% visible -->
    <pattern id="itPattern" width="360" height="360" patternUnits="userSpaceOnUse"
             patternTransform="rotate(6)">
      <!-- laptop -->
      <g transform="translate(20,40)">
        <path d="M0 46 L18 0 H86 L104 46 Z" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="4"/>
        <rect x="-14" y="46" width="132" height="12" rx="4" fill="#000000" fill-opacity="0.25"/>
        <rect x="28" y="10" width="48" height="30" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="3"/>
      </g>

      <!-- desktop monitor on stand -->
      <g transform="translate(220,60)">
        <rect x="0" y="0" width="90" height="60" rx="4" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="4"/>
        <rect x="38" y="60" width="14" height="20" fill="#000000" fill-opacity="0.25"/>
        <rect x="18" y="80" width="54" height="8" rx="3" fill="#000000" fill-opacity="0.25"/>
      </g>

      <!-- microchip -->
      <g transform="translate(60,200)">
        <rect x="0" y="0" width="60" height="60" rx="6" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="4"/>
        <rect x="16" y="16" width="28" height="28" fill="#000000" fill-opacity="0.2"/>
        <path d="M0 14 H-14 M0 30 H-14 M0 46 H-14 M60 14 H74 M60 30 H74 M60 46 H74 M14 0 V-14 M30 0 V-14 M46 0 V-14 M14 60 V74 M30 60 V74 M46 60 V74"
              stroke="#000000" stroke-opacity="0.25" stroke-width="3"/>
      </g>

      <!-- tower / PC case -->
      <g transform="translate(230,220)">
        <rect x="0" y="0" width="46" height="86" rx="4" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="4"/>
        <circle cx="23" cy="16" r="5" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="3"/>
        <rect x="10" y="34" width="26" height="4" fill="#000000" fill-opacity="0.2"/>
        <rect x="10" y="44" width="26" height="4" fill="#000000" fill-opacity="0.2"/>
      </g>

      <!-- wifi / signal glyph -->
      <g transform="translate(150,290)">
        <path d="M-20 0 A28 28 0 0 1 20 0" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="4"/>
        <path d="M-11 9 A16 16 0 0 1 11 9" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="4"/>
        <circle cx="0" cy="16" r="3.5" fill="#000000" fill-opacity="0.25"/>
      </g>
    </pattern>
  </defs>

  <!-- base gradient -->
  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- depth glows -->
  <ellipse cx="380" cy="180" rx="1500" ry="900" fill="url(#glowMint)"/>
  <ellipse cx="2300" cy="1320" rx="1500" ry="950" fill="url(#glowBlue)"/>
  <ellipse cx="1280" cy="720" rx="1100" ry="700" fill="url(#glowTeal)"/>

  <!-- large soft capsules, echoing the reference layout -->
  <g opacity="0.75">
    <rect x="-150" y="-120" width="1150" height="520" rx="260" fill="#ffffff" fill-opacity="0.1"
          transform="rotate(-42 425 140)"/>
    <rect x="1550" y="900" width="1250" height="560" rx="280" fill="#ffffff" fill-opacity="0.08"
          transform="rotate(-42 2175 1180)"/>
    <ellipse cx="1280" cy="720" rx="620" ry="360" fill="url(#wDeep)" fill-opacity="0.06"/>
  </g>

  <!-- circuit-node accents, replacing the wave lines -->
  <rect width="2560" height="1440" fill="url(#circuitGrid)"/>
  <g stroke-linecap="round" fill="none">
    <circle cx="420" cy="260" r="10" fill="url(#wMint)"/>
    <circle cx="900" cy="180" r="6" fill="url(#wMint)"/>
    <path d="M420 260 L900 180 L1340 340" stroke="url(#wMint)" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="1340" cy="340" r="8" fill="url(#wBlue)"/>
    <circle cx="1820" cy="240" r="7" fill="url(#wBlue)"/>
    <path d="M1340 340 L1820 240 L2260 420" stroke="url(#wBlue)" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="2260" cy="420" r="9" fill="url(#wDeep)"/>
    <circle cx="300" cy="820" r="9" fill="url(#wBlue)"/>
    <circle cx="760" cy="960" r="6" fill="url(#wBlue)"/>
    <path d="M300 820 L760 960 L1220 880" stroke="url(#wBlue)" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="1220" cy="880" r="8" fill="url(#wDeep)"/>
    <circle cx="1680" cy="1020" r="7" fill="url(#wDeep)"/>
    <path d="M1220 880 L1680 1020 L2140 940" stroke="url(#wDeep)" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="2140" cy="940" r="9" fill="url(#wMint)"/>
    <circle cx="560" cy="1240" r="8" fill="url(#wMint)"/>
    <circle cx="1040" cy="1180" r="6" fill="url(#wMint)"/>
    <path d="M560 1240 L1040 1180 L1520 1300" stroke="url(#wMint)" stroke-opacity="0.4" stroke-width="3"/>
    <circle cx="1520" cy="1300" r="8" fill="url(#wBlue)"/>
    <circle cx="1980" cy="1200" r="7" fill="url(#wBlue)"/>
    <path d="M1520 1300 L1980 1200 L2420 1320" stroke="url(#wBlue)" stroke-opacity="0.4" stroke-width="3"/>
    <circle cx="2420" cy="1320" r="9" fill="url(#wDeep)"/>
  </g>

  <!-- legibility veil -->
  <rect width="2560" height="1440" fill="url(#veil)"/>

  <!-- IT-themed silhouette pattern on top, black, ~25% visible -->
  <rect width="2560" height="1440" fill="url(#itPattern)"/>
</svg>
